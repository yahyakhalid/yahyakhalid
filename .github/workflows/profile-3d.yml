name: 3D contribution city

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-3d.yml", "scripts/compose.py", "assets/panels/panel-b.template.svg"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Compose the profile panel
        run: python3 scripts/compose.py profile-3d-contrib/profile-night-green.svg assets/panels/panel-b.template.svg profile-3d-contrib/panel-b.svg
      - name: Commit the new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Update 3D contribution city"
          git push
